<!DOCTYPE html>
<html lang="pl" data-mode="light" data-panel="wall">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorium wyglądu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Cztery warstwy głębi: ściana, arkusz, instrumenty, paleta.
   Jedna zasada ruchu: krawędź prowadząca ciągnie, a reszta podąża z opóźnieniem. */
:root {
  --font: 'Geist', ui-sans-serif, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  --mono: 'Geist Mono', 'Cascadia Code', Consolas, ui-monospace, monospace;
  --spring: cubic-bezier(.2, .9, .25, 1);
  --spring-pop: cubic-bezier(.2, 1.3, .3, 1);

  --ui-s: 13px;
  --title: var(--font);
  --title-w: 550;
  --title-s: 14px;
  --title-ls: -.01em;
  --pl-w: 500;
  --pl-s: 13px;
  --input-s: 15.5px;
  --meta: 'Geist Mono', 'Cascadia Code', Consolas, monospace;
  --meta-s: 11px;
  --meta-ls: -.01em;

  --rail: 60px;
  --panel: 264px;
  --insp: 300px;
  --r-row: 10px;

  /* Galeria za dnia */
  --gap: 10px;
  --rail-left: 10px;
  --nav-top: 10px;
  --nav-bot: 10px;
  --shape-left: 10px;
  --r-shell: 22px;
  --r-sheet: 16px;
  --r-dock: 18px;
  --stage-top: 4px;
  --stage-bot: 78px;
  --stage-gap: 14px;
  --stage-right: 14px;
  --dock-bot: 13px;
  --insp-top: 40px;
  --insp-bot: 13px;

  --wall: #e7e7e9;
  --wall-hi: #f0f0f2;
  --surface: #ffffff;
  --raised: #ffffff;
  --solid: #ffffff;
  --well: #f5f5f6;
  --ink: #131316;
  --ink-2: #63636b;
  --ink-3: #93939b;
  --hair: rgb(19 19 22 / .07);
  --hair-2: rgb(19 19 22 / .13);
  --line: rgb(19 19 22 / .15);
  --hover: rgb(19 19 22 / .04);
  --on: rgb(19 19 22 / .06);
  --key: #fbfbfc;
  --tool-on: #131316;
  --tool-on-ink: #ffffff;
  --logo: #131316;
  --logo-ink: #ffffff;
  --cnt: #131316;
  --cnt-ink: #ffffff;
  --signal: #f0480a;
  --signal-ink: #ffffff;
  --st-read: var(--ink-2);
  --st-decide: var(--signal);
  --st-done: var(--ink-3);
  --pin: #131316;
  --pin-ink: #ffffff;
  --mark: var(--ink);
  --mark-ink: var(--solid);
  --shape-fill: var(--surface);
  --shape-stroke: transparent;
  --shape-shadow: drop-shadow(0 1px 1px rgb(0 0 0 / .03)) drop-shadow(0 12px 28px rgb(0 0 0 / .06));
  --sh-sheet: 0 0 0 .5px rgb(0 0 0 / .05), 0 2px 4px rgb(0 0 0 / .03), 0 26px 64px -14px rgb(0 0 0 / .13);
  --sh-dock: 0 0 0 .5px rgb(0 0 0 / .06), 0 4px 10px rgb(0 0 0 / .04), 0 22px 48px -10px rgb(0 0 0 / .18);
  --sh-pop: 0 0 0 .5px rgb(0 0 0 / .07), 0 6px 14px rgb(0 0 0 / .06), 0 26px 56px -12px rgb(0 0 0 / .2);
  --scrim: rgb(231 231 233 / .55);
  --glow-a: .0;
}

[data-mode="dark"] {
  color-scheme: dark;
  --wall: #08080a;
  --wall-hi: #0c0c0e;
  --surface: #151517;
  --raised: #1c1c1f;
  --solid: #1c1c1f;
  --well: #202023;
  --ink: #f4f4f5;
  --ink-2: #a4a4ac;
  --ink-3: #6e6e76;
  --hair: rgb(255 255 255 / .07);
  --hair-2: rgb(255 255 255 / .12);
  --line: rgb(255 255 255 / .14);
  --hover: rgb(255 255 255 / .05);
  --on: rgb(255 255 255 / .09);
  --key: #26262a;
  --tool-on: #f4f4f5;
  --tool-on-ink: #131316;
  --logo: #f4f4f5;
  --logo-ink: #131316;
  --cnt: #f4f4f5;
  --cnt-ink: #131316;
  --signal: #ff6b30;
  --signal-ink: #1f0b02;
  --shape-stroke: rgb(255 255 255 / .05);
  --shape-shadow: drop-shadow(0 16px 32px rgb(0 0 0 / .5));
  --sh-sheet: 0 0 0 .5px rgb(255 255 255 / .08), 0 30px 80px -16px rgb(0 0 0 / .8);
  --sh-dock: inset 0 .5px 0 rgb(255 255 255 / .1), 0 0 0 .5px rgb(255 255 255 / .06), 0 24px 56px -10px rgb(0 0 0 / .8);
  --sh-pop: inset 0 .5px 0 rgb(255 255 255 / .1), 0 0 0 .5px rgb(255 255 255 / .07), 0 28px 60px -12px rgb(0 0 0 / .85);
  --scrim: rgb(5 5 6 / .55);
  --glow-a: .36;
}

/* Ikona to linia. Wybrana dostaje bryłę, która wsuwa się pod linię */
@property --ic-p { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --ic-o { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --ic-d { syntax: '<color>'; inherits: true; initial-value: transparent; }

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  overflow: hidden;
  background: var(--wall);
  color: var(--ink);
  font: 400 var(--ui-s)/1.4 var(--font);
  letter-spacing: -.003em;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; background: none; border: 0; padding: 0; outline: 0; }
button { cursor: default; }
:focus-visible { outline: 2px solid var(--tool-on); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible { outline: 0; }
.ic {
  --ic-o: 1.15; --ic-d: currentColor;
  width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor;
  stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round;
  transition: --ic-o .46s var(--spring-pop), --ic-p .2s ease, --ic-d .2s ease;
}
.ic-plate { fill: currentColor; fill-opacity: var(--ic-p); stroke: none; transform: translate(calc(var(--ic-o) * 1px), calc(var(--ic-o) * 1px)); }
.ic-d { stroke: var(--ic-d); }
.rb, .mini { --ic-cut: var(--surface); }
.tb { --ic-cut: var(--raised); }
.tools .tb.on { --ic-cut: var(--tool-on); }
:is(.rb[aria-current="true"], .tools .tb.on, .tb.lit, .mini.on) .ic { --ic-p: 1; --ic-o: 0; --ic-d: var(--ic-cut); }
kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; padding: 0 5px;
  color: var(--ink-2); font: 500 11px/1 var(--font);
  background: var(--key); border-radius: 6px;
  box-shadow: inset 0 0 0 .5px var(--hair-2), 0 1px 0 var(--hair-2);
}

html.theming *:not(.stage):not(.rail):not(.panel):not(.pane) {
  transition: background-color .42s ease, color .42s ease, box-shadow .42s ease, fill .42s ease, stroke .42s ease !important;
}

/* Pasek laboratorium: to narzędzie do oceny, nie część aplikacji */
.labbar {
  position: fixed; inset: 0 0 auto 0; z-index: 100;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  height: 36px; padding: 0 10px 0 14px;
  color: #b9b9c0; background: #0d0d0f;
  font: 400 11.5px/1 var(--mono); letter-spacing: 0;
}
.lab-left { display: flex; gap: 10px; min-width: 0; white-space: nowrap; overflow: hidden; }
.lab-left b { color: #f4f4f5; font-weight: 500; }
.lab-seg { position: relative; display: flex; gap: 2px; padding: 2px; background: #1b1b1e; border-radius: 9px; }
.lab-seg button { position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 6px; color: #9b9ba3; border-radius: 7px; transition: color .2s; }
.lab-seg button[aria-checked="true"] { color: #f4f4f5; }
.lab-seg button:hover { color: #f4f4f5; }
.lab-seg kbd { min-width: 16px; height: 16px; padding: 0 3px; color: #b9b9c0; font: 500 10px/1 var(--mono); background: rgb(255 255 255 / .08); box-shadow: none; border-radius: 4px; }
.lab-pill { position: absolute; left: 0; top: 0; background: #2e2e33; border-radius: 7px; }
.lab-right { display: flex; justify-content: flex-end; align-items: center; gap: 12px; min-width: 0; white-space: nowrap; }
.lab-hint { overflow: hidden; text-overflow: ellipsis; color: #77777f; }
.lab-mode { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; color: #d6d6db; border-radius: 7px; background: #1b1b1e; }
.lab-mode:hover { background: #2a2a2e; }
.lab-mode .ic { width: 16px; height: 16px; }

.app { position: fixed; inset: 36px 0 0 0; overflow: hidden; background: var(--wall); }
.wall { position: absolute; inset: 0; background: radial-gradient(120% 80% at 55% -12%, var(--wall-hi), var(--wall) 68%); }
.lights { position: absolute; inset: 0; opacity: var(--glow-a); transition: opacity .9s ease; --sx: 50%; }
.at-home .lights { opacity: calc(var(--glow-a) * .62); }
.no-lib .lights { opacity: 0; }
.lights i { position: absolute; display: block; border-radius: 50%; filter: blur(70px); transition: background-color 1.3s ease; }
.lights i:nth-child(1) { left: calc(var(--sx) - 46vw); top: 2%; width: 42vw; height: 62%; background: var(--g1, #e7c9a0); }
.lights i:nth-child(2) { left: calc(var(--sx) + 2vw); top: -8%; width: 46vw; height: 70%; background: var(--g2, #9fb4d6); }
.lights i:nth-child(3) { left: calc(var(--sx) - 22vw); top: 50%; width: 46vw; height: 60%; background: var(--g3, #d8a8a0); }

.caption { position: absolute; right: 0; top: 0; z-index: 30; display: flex; height: 32px; color: var(--ink-2); pointer-events: none; }
.caption span { display: grid; place-items: center; width: 44px; height: 32px; }
.caption .ic { width: 14px; height: 14px; stroke-width: 1.1; }

/* Nawigacja */
.nav { position: absolute; inset: 0; z-index: 20; pointer-events: none; }
.shape { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.shape path { fill: var(--shape-fill); stroke: var(--shape-stroke); stroke-width: 1; vector-effect: non-scaling-stroke; filter: var(--shape-shadow); }
.rail {
  position: absolute; left: var(--rail-left); top: var(--nav-top); bottom: var(--nav-bot); width: var(--rail);
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0;
  pointer-events: auto; transition: left .5s var(--spring), top .5s var(--spring), bottom .5s var(--spring);
}
.logo { display: grid; place-items: center; width: 36px; height: 36px; margin-bottom: 10px; color: var(--logo-ink); background: var(--logo); border-radius: 11px; }
.logo .ic { width: 22px; height: 22px; stroke: none; fill: currentColor; }
.logo { transition: transform .3s var(--spring-pop); }
.logo:active { transform: scale(.92); }
.rb { position: relative; z-index: 1; display: grid; place-items: center; width: 40px; height: 40px; color: var(--ink-2); border-radius: 12px; transition: color .18s, transform .3s var(--spring-pop); }
.rb:active { transform: scale(.92); }
.rb:hover, .rb[aria-current="true"] { color: var(--ink); }
.rb i { position: absolute; right: 8px; top: 8px; width: 7px; height: 7px; background: var(--ink); border: 1.5px solid var(--solid); border-radius: 50%; }
.rb i.decide { background: var(--signal); }
.rb i { transition: opacity .4s ease; }
.no-lib .rb i { opacity: 0; }
.rail-sep { flex: 1; }
.rail-pill, .rail-hover { position: absolute; left: 0; top: 0; border-radius: 12px; pointer-events: none; }
.rail-pill { background: var(--on); }
.rail-hover { background: var(--hover); opacity: 0; transition: opacity .16s; }

.panel {
  position: absolute; left: calc(var(--rail-left) + var(--rail)); top: var(--nav-top); bottom: var(--nav-bot); width: var(--panel);
  display: flex; flex-direction: column; pointer-events: auto;
  transition: left .5s var(--spring), top .5s var(--spring), bottom .5s var(--spring);
}
.nav:not(.is-open):not(.moving) .panel { visibility: hidden; }
.nav.moving .rv {
  -webkit-mask-image: linear-gradient(90deg, #000 calc(var(--e, 0px) - 34px), transparent var(--e, 0px));
  mask-image: linear-gradient(90deg, #000 calc(var(--e, 0px) - 34px), transparent var(--e, 0px));
}
.nav-clip { position: absolute; inset: 0; pointer-events: none; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 60px; padding: 10px 14px 6px 12px; }
.panel-head strong { display: block; font: var(--title-w) var(--title-s)/1.15 var(--title); letter-spacing: var(--title-ls); }
.panel-head span { display: block; margin-top: 2px; color: var(--ink-3); font-family: var(--meta); font-size: var(--meta-s); letter-spacing: var(--meta-ls); white-space: nowrap; }
.panel-scroll { position: relative; flex: 1; min-height: 0; padding: 2px 8px 14px; overflow: hidden auto; scrollbar-width: none; }
.panel-scroll::-webkit-scrollbar { display: none; }
.sel-pill, .hover-pill { position: absolute; left: 0; top: 0; border-radius: var(--r-row); pointer-events: none; }
.sel-pill { background: var(--on); }
.hover-pill { background: var(--hover); opacity: 0; transition: opacity .16s; }
#panelItems.swap { animation: list-in .42s var(--spring) both; }
@keyframes list-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.row { position: relative; z-index: 1; display: flex; align-items: center; gap: 7px; width: 100%; min-height: 32px; padding: 0 8px 0 8px; color: var(--ink-2); text-align: left; border-radius: var(--r-row); transition: color .16s; }
.row:hover { color: var(--ink); }
.row.on { color: var(--ink); font-weight: 500; }
.row .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .num { color: var(--ink-3); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.row .ic { width: 16px; height: 16px; color: var(--ink-3); }
.row.head { color: var(--ink); font-weight: 500; }
.row .chev { width: 14px; height: 14px; stroke-width: 1.6; transition: transform .38s var(--spring-pop); transform: rotate(90deg); }
.closed > .row .chev { transform: rotate(0); }
.kids { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .42s var(--spring); }
.kids-in { min-height: 0; overflow: hidden; }
.closed > .kids { grid-template-rows: 0fr; }
.grp { position: relative; padding-left: 15px; }
.tl { position: relative; padding-left: 15px; }
.tl::before { content: ''; position: absolute; left: 0; top: -3px; width: 11px; height: 19px; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); border-bottom-left-radius: 8px; }
.tl:not(:last-child)::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1px solid var(--line); }
.tag { flex: none; padding: 1px 5px; color: var(--ink-3); font: 500 10.5px/1.4 var(--meta); font-variant-numeric: tabular-nums; border-radius: 5px; box-shadow: inset 0 0 0 .5px var(--hair-2); }
.dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.dot.read { background: var(--st-read); }
.dot.decide { background: var(--st-decide); }
.dot.done { background: var(--st-done); }
.two { min-height: 46px; padding-top: 5px; padding-bottom: 6px; flex-direction: column; align-items: stretch; gap: 1px; }
.two .line { display: flex; align-items: center; gap: 7px; min-width: 0; }
.two .sub { overflow: hidden; color: var(--ink-3); font-family: var(--meta); font-size: var(--meta-s); font-weight: 400; letter-spacing: var(--meta-ls); text-overflow: ellipsis; white-space: nowrap; }
.seg { position: relative; display: flex; gap: 2px; margin: 0 2px 6px; padding: 2px; background: var(--hover); border-radius: 10px; }
.seg button { position: relative; z-index: 1; flex: 1; height: 26px; padding: 0 8px; color: var(--ink-2); font-size: 12px; white-space: nowrap; border-radius: 8px; }
.seg button.on { color: var(--ink); font-weight: 500; background: var(--solid); box-shadow: 0 0 0 .5px var(--hair-2), 0 1px 2px rgb(0 0 0 / .05); }
.mini { display: grid; place-items: center; width: 28px; height: 28px; color: var(--ink-3); border-radius: 9px; transition: color .16s, background-color .16s; }
.mini:hover { color: var(--ink); background: var(--hover); }
.mini .ic { width: 16px; height: 16px; }
.mini.on { color: var(--ink); background: var(--on); }

.nav-chev { position: absolute; left: 0; top: 0; z-index: 3; display: grid; place-items: center; width: 22px; height: 22px; color: var(--ink-3); background: var(--solid); border-radius: 50%; box-shadow: 0 0 0 .5px var(--hair-2), 0 2px 5px rgb(0 0 0 / .06); pointer-events: auto; }
.nav-chev:hover { color: var(--ink); }
.nav-chev .ic { width: 12px; height: 12px; stroke-width: 1.9; }
.nav-grip { position: absolute; left: 0; top: var(--nav-top); bottom: var(--nav-bot); z-index: 2; width: 16px; cursor: ew-resize; pointer-events: auto; touch-action: none; }

.flyout { position: absolute; z-index: 36; width: 232px; padding: 6px; background: var(--raised); border-radius: 14px; box-shadow: var(--sh-pop); opacity: 0; transform: translateX(-8px) scale(.97); transform-origin: 0 12px; pointer-events: none; transition: opacity .16s, transform .36s var(--spring-pop); }
.flyout.on { opacity: 1; transform: none; pointer-events: auto; }
.flyout header { padding: 5px 8px 6px; color: var(--ink-3); font-size: 11.5px; }
.flyout .row:hover { background: var(--hover); }

/* Scena */
.stage { position: absolute; top: var(--stage-top); bottom: var(--stage-bot); z-index: 10; transform-origin: 50% 100%; transition: top .5s var(--spring), bottom .5s var(--spring); }
.pane { position: absolute; left: 0; top: 0; bottom: 0; display: flex; flex-direction: column; min-width: 0; border-radius: 14px; animation: rise .7s var(--spring) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.placard { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; height: 36px; padding: 0 2px 0 4px; mask-image: linear-gradient(90deg, #000 calc(var(--vis, 300vw) - var(--fade, 0px)), transparent var(--vis, 300vw)); }
.pl-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
.pl-title { overflow: hidden; font: var(--pl-w) var(--pl-s)/1.25 var(--title); text-overflow: ellipsis; letter-spacing: var(--title-ls); }
.pl-meta { display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; color: var(--ink-3); font-family: var(--meta); font-size: var(--meta-s); letter-spacing: var(--meta-ls); }
.pl-meta .ic { width: 13px; height: 13px; stroke-width: 1.5; }
.pl-actions { display: flex; flex: none; gap: 1px; transition: margin-right .5s var(--spring), opacity .16s; }
.under-caption .pane.last .pl-actions { margin-right: 124px; }
.pane:not(.focused) .pl-title { color: var(--ink-2); font-weight: 400; }
.split .pane.focused .pl-title::before { content: ''; display: inline-block; width: 6px; height: 6px; margin: 0 7px 1px 0; background: var(--tool-on); border-radius: 50%; }
.sheet { position: relative; flex: 1; min-height: 0; overflow: hidden auto; border-radius: var(--r-sheet); box-shadow: var(--sh-sheet); scrollbar-width: thin; scrollbar-color: rgb(128 128 128 / .3) transparent; transition: box-shadow .4s ease, filter .4s ease; }
.split .pane:not(.focused) .sheet { filter: brightness(.975) saturate(.94); }
[data-mode="dark"].split-dim .pane:not(.focused) .sheet { filter: brightness(.82); }
[data-tool="comment"] .doc, [data-tool="sticky"] .doc { cursor: crosshair; }
.split-handle { position: absolute; top: 44px; bottom: 8px; z-index: 3; display: grid; place-items: center; width: 16px; cursor: ew-resize; opacity: 0; touch-action: none; }
.split-handle i { display: block; width: 4px; height: 36px; background: var(--line); border-radius: 4px; transition: height .34s var(--spring-pop), background-color .2s; }
.split-handle:hover i { height: 64px; background: var(--ink-2); }

/* Dokument: to treść od agenta, więc ma własny styl, niezależny od aplikacji */
.doc { position: relative; min-height: 100%; padding: clamp(32px, 6vh, 64px) clamp(26px, 8%, 76px) 96px; user-select: text; cursor: auto; animation: doc-in .46s var(--spring) both; }
@keyframes doc-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.doc .inner { position: relative; max-width: 620px; margin: 0 auto; }
.t-paper { --d-bg: #ffffff; --d-ink: #1c1b19; --d-mut: #706b62; --d-line: #e8e5df; --d-acc: #9c4a22; --d-soft: #f7f4ef; background: var(--d-bg); color: var(--d-ink); font: 400 17px/1.6 'Newsreader', Georgia, serif; letter-spacing: 0; }
.t-night { --d-bg: #10141a; --d-ink: #e6e9ee; --d-mut: #8f99a8; --d-line: #262d38; --d-acc: #f2b35e; --d-soft: #171d26; background: var(--d-bg); color: var(--d-ink); font: 400 15px/1.65 'Segoe UI', system-ui, sans-serif; letter-spacing: 0; }
.t-clean { --d-bg: #fbfcfc; --d-ink: #17212b; --d-mut: #5c6a78; --d-line: #e2e8ee; --d-acc: #0f766e; --d-soft: #eff5f4; background: var(--d-bg); color: var(--d-ink); font: 400 15.5px/1.65 'Segoe UI', system-ui, sans-serif; letter-spacing: 0; }
.doc .kicker { margin-bottom: 10px; color: var(--d-acc); font: 500 12px/1.2 'Segoe UI', system-ui, sans-serif; letter-spacing: .02em; }
.doc h1 { margin-bottom: 14px; font-size: clamp(27px, 3.4vw, 38px); font-weight: 500; line-height: 1.12; letter-spacing: -.016em; text-wrap: balance; }
.doc .lead { margin-bottom: 30px; color: var(--d-mut); font-size: 1.12em; line-height: 1.5; text-wrap: pretty; }
.doc h2 { margin: 34px 0 10px; font-size: 1.28em; font-weight: 500; letter-spacing: -.01em; }
.doc p { margin-bottom: 12px; text-wrap: pretty; }
.doc table { width: 100%; margin: 16px 0 6px; border-collapse: collapse; font: 400 13.5px/1.4 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.doc th { padding: 7px 10px 7px 0; color: var(--d-mut); font-weight: 500; text-align: left; border-bottom: 1px solid var(--d-line); }
.doc td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--d-line); }
.doc tr.pick td { font-weight: 600; }
.doc ol, .doc ul { margin: 10px 0 12px; padding-left: 1.2em; }
.doc li { margin-bottom: 7px; }
.doc pre { margin: 12px 0; padding: 14px 16px; overflow: auto; color: var(--d-ink); font: 400 12.5px/1.6 var(--mono); background: var(--d-soft); border-radius: 10px; }
.bars { display: grid; gap: 8px; margin: 14px 0 8px; font: 400 13px/1.3 'Segoe UI', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
.bars div { display: grid; grid-template-columns: 112px 1fr 70px; align-items: center; gap: 10px; }
.bars span { display: block; height: 12px; background: var(--d-line); border-radius: 3px; }
.bars span b { display: block; height: 100%; background: var(--d-acc); border-radius: 3px; }
.bars em { color: var(--d-mut); font-style: normal; text-align: right; }
.doc .callout { margin: 16px 0; padding: 12px 14px; font-size: .94em; background: var(--d-soft); border-radius: 10px; }
.chart { display: block; width: 100%; height: auto; margin: 12px 0; }
.boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; font-size: 13.5px; }
.boxes div { padding: 12px; background: var(--d-soft); border-radius: 10px; }
.boxes b { display: block; margin-bottom: 2px; font-weight: 600; }
.hl { color: inherit; background: linear-gradient(0deg, rgb(238 186 80 / .36), rgb(238 186 80 / .36)) no-repeat 0 92% / 100% 42%; transition: background-size .52s var(--spring); }
.hl.lit { background-size: 100% 92%; }
.t-night .hl { background-image: linear-gradient(0deg, rgb(242 179 94 / .3), rgb(242 179 94 / .3)); }
.anchor { position: relative; display: inline-block; width: 0; height: 0; }
.pin {
  position: absolute; left: -1px; bottom: 11px; z-index: 2; display: grid; place-items: center; width: 24px; height: 24px;
  color: var(--pin-ink); font: 600 11px/1 var(--font); background: var(--pin); border-radius: 50% 50% 50% 4px;
  box-shadow: 0 0 0 1.5px #fff, 0 4px 10px rgb(0 0 0 / .24); transition: transform .36s var(--spring-pop), background-color .3s; user-select: none;
}
.pin.hot { --pin: #f0480a; }
.pin.me { color: #131316; background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / .16), 0 4px 10px rgb(0 0 0 / .16); }
.pin:hover { transform: scale(1.12); }
.pin.on { transform: scale(1.2); }
.pin.free { bottom: auto; margin: -27px 0 0 -3px; }
.pin.anch { left: -38px; bottom: auto; }
.stick {
  float: right; width: 148px; margin: 6px -36px 14px 20px; padding: 10px 12px 14px;
  color: #3a3312; font: 500 12px/1.35 var(--font); text-align: left; letter-spacing: 0;
  border-radius: 3px 3px 14px 3px; transform: rotate(1.3deg);
  box-shadow: 0 1px 1px rgb(0 0 0 / .05), 0 12px 18px -8px rgb(0 0 0 / .24); transition: transform .42s var(--spring-pop); user-select: none;
}
.stick:hover, .stick.on { transform: rotate(0) translateY(-2px) scale(1.02); }
.stick.free { position: absolute; float: none; margin: 0; }
.yellow { --note: #f7e7a0; }
.blue-n { --note: #cfe3f7; }
.green-n { --note: #d4ebcc; }
.pink { --note: #f7d5df; }
.stick, .swatch, .gs, .th-mark.sticky, .cr .tile.sw { background: var(--note); }
.draft { position: absolute; z-index: 6; width: 0; height: 0; }
.draft .pin { animation: drop .44s var(--spring-pop) both; }
.draft .pin.free { margin: -27px 0 0 -3px; }
@keyframes drop { from { opacity: 0; transform: translateY(-14px) scale(.7); } to { opacity: 1; transform: none; } }
.bubble {
  position: absolute; left: 30px; top: -36px; width: 272px; padding: 10px 10px 8px;
  color: var(--ink); font: 400 13px/1.4 var(--font); background: var(--solid); border-radius: 14px;
  box-shadow: var(--sh-pop); transform-origin: 0 24px; animation: grow .44s var(--spring-pop) both; cursor: default; user-select: none;
}
@keyframes grow { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
.bubble textarea { display: block; width: 100%; min-height: 44px; resize: none; line-height: 1.4; user-select: text; }
.bubble textarea::placeholder { color: var(--ink-3); }
.bubble-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.bubble .seg { flex: none; margin: 0; }
.bubble .seg button { height: 24px; font-size: 11.5px; }
.bubble .hint { display: flex; gap: 3px; }

/* Panel uwag */
.insp { position: absolute; inset: 0; z-index: 21; pointer-events: none; }
.insp-in { position: absolute; top: var(--insp-top); bottom: var(--insp-bot); right: var(--stage-right); width: var(--insp); display: flex; flex-direction: column; opacity: 0; }
.insp.open .insp-in { pointer-events: auto; }
.insp-head { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 6px 10px 2px 16px; }
.insp-head strong { font: var(--title-w) var(--title-s)/1.15 var(--title); letter-spacing: var(--title-ls); }
.insp-head strong span { margin-left: 4px; color: var(--ink-3); font-family: var(--meta); font-size: var(--meta-s); font-weight: 400; letter-spacing: var(--meta-ls); }
.threads { flex: 1; min-height: 0; padding: 0 8px 12px; overflow: hidden auto; scrollbar-width: none; }
.thread { padding: 10px; border-radius: 14px; transition: background-color .2s, box-shadow .3s; }
.thread + .thread { margin-top: 2px; }
.thread:hover { background: var(--hover); }
.thread.on { background: var(--well); }
.th-head { display: flex; gap: 9px; }
.th-mark { flex: none; display: grid; place-items: center; width: 22px; height: 22px; color: var(--mark-ink); font: 600 10.5px/1 var(--font); background: var(--mark); border-radius: 50% 50% 50% 4px; }
.th-mark.hot { --mark: var(--signal); --mark-ink: var(--signal-ink); }
.th-mark.me { color: var(--ink); background: transparent; box-shadow: inset 0 0 0 1px var(--hair-2); }
.th-mark.sticky { border-radius: 3px 3px 8px 3px; box-shadow: none; color: #3a3312; }
.th-text { min-width: 0; font-size: 13px; line-height: 1.42; text-wrap: pretty; }
.th-meta { display: flex; flex-wrap: wrap; gap: 2px 8px; margin: 4px 0 0 31px; color: var(--ink-3); font-family: var(--meta); font-size: var(--meta-s); letter-spacing: var(--meta-ls); }
.th-flag { color: var(--signal); }
.th-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--spring); }
.thread.on .th-body { grid-template-rows: 1fr; }
.th-body > div { min-height: 0; overflow: hidden; }
.msg { margin: 8px 0 0 31px; padding-top: 8px; font-size: 12.5px; line-height: 1.42; border-top: 1px solid var(--hair); }
.msg b { display: flex; align-items: center; gap: 5px; margin-bottom: 1px; color: var(--ink-2); font-size: 11.5px; font-weight: 500; }
.msg b .ic { width: 13px; height: 13px; }
.reply { display: flex; align-items: center; gap: 6px; margin: 10px 0 0 31px; padding: 6px 6px 6px 10px; background: var(--solid); border-radius: 10px; box-shadow: 0 0 0 .5px var(--hair-2); }
.reply input { flex: 1; min-width: 0; font-size: 12.5px; user-select: text; }
.reply input::placeholder { color: var(--ink-3); }
.empty { padding: 14px 16px; color: var(--ink-3); font-size: 12.5px; line-height: 1.45; }

/* Przy zamkniętym panelu wątek wyrasta z pinezki */
.th-pop { position: absolute; z-index: 5; width: 300px; color: var(--ink); font: 400 13px/1.4 var(--font); letter-spacing: 0; text-align: left; background: var(--solid); border-radius: 14px; box-shadow: var(--sh-pop); transform-origin: 12px 0; animation: grow .44s var(--spring-pop) both; cursor: default; user-select: none; }
.th-pop .thread, .th-pop .thread:hover, .th-pop .thread.on { background: none; }
.th-pop .th-mark { display: none; }
.th-pop .th-meta, .th-pop .msg, .th-pop .reply { margin-left: 0; }

/* Otwarty panel: wątki wiszą na ścianie obok arkusza, na wysokości cytatu */
.view-seg { flex: none; gap: 1px; margin: 0 2px 0 auto; }
.view-seg button { position: relative; z-index: 1; flex: none; width: 28px; height: 24px; padding: 0; color: var(--ink-3); --ic-cut: var(--solid); }
.view-seg button:hover { color: var(--ink); background: none; }
.view-seg button.on { color: var(--ink); background: none; box-shadow: none; }
.insp.no-wall .view-seg { visibility: hidden; }
.view-pill { position: absolute; left: 0; top: 0; background: var(--solid); border-radius: 8px; box-shadow: 0 0 0 .5px var(--hair-2), 0 1px 2px rgb(0 0 0 / .06); }
[data-panel="wall"] .threads { position: relative; padding: 0; overflow: visible; clip-path: inset(0 -28px); }
[data-panel="wall"] .thread { position: absolute; left: 0; right: 0; top: 0; margin: 0; background: var(--raised); box-shadow: var(--sh-pop); }
[data-panel="wall"] .thread:hover, [data-panel="wall"] .thread.on { background: var(--raised); }
[data-panel="wall"] .empty { display: none; }

/* Arkusze: liczba przypiętych wybiera układ, a zerknięcie wisi nad każdym z nich */
.pane.peek { z-index: 2; }
.stage.peeking .pane:not(.peek) .pl-actions { opacity: 0; pointer-events: none; }
.pane.peek .sheet { box-shadow: var(--sh-pop); }
.pane.peek :is(.pl-meta, [data-act="refresh"], [data-act="reveal"], [data-moved="split"]) { display: none; }
.ask.pl-pin { display: none; height: 28px; font-size: 12.5px; }
.pl-pin .ic { width: 16px; height: 16px; }
.pane.peek .ask.pl-pin { display: flex; }
.cam-box { flex: none; width: 0; overflow: hidden; }
.cam-in { display: flex; align-items: center; width: max-content; height: 36px; }
.cam { display: flex; align-items: center; gap: 3px; padding: 0 5px; }
.cam i { width: 12px; height: 17px; background: var(--line); border-radius: 3.5px; cursor: pointer; transition: background-color .22s, transform .36s var(--spring-pop); }
.cam i:hover { transform: translateY(-1px); }
.cam i.on { background: var(--ink); }

/* Dok i paleta to jeden obiekt */
.scrim { position: absolute; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; pointer-events: none; -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.dock { position: absolute; bottom: var(--dock-bot); z-index: 40; overflow: hidden; color: var(--ink); background: var(--raised); box-shadow: var(--sh-dock); }
.dock-bar { position: absolute; left: 50%; bottom: 0; display: flex; align-items: center; gap: 4px; width: max-content; height: 52px; padding: 0 8px; transform: translateX(-50%); }
.tools { position: relative; display: flex; gap: 2px; }
.tool-pill { position: absolute; left: 0; top: 0; background: var(--tool-on); border-radius: 10px; }
.tb { position: relative; z-index: 1; display: grid; place-items: center; width: 36px; height: 36px; color: var(--ink-2); border-radius: 10px; transition: color .16s, background-color .16s, transform .3s var(--spring-pop); }
.tb:hover { color: var(--ink); background: var(--hover); }
.tb:active { transform: scale(.9); }
.tools .tb.on { color: var(--tool-on-ink); background: none; }
.tb.lit { color: var(--ink); background: var(--on); }
.sep { flex: none; width: 1px; height: 20px; margin: 0 4px; background: var(--hair-2); }
.pl-moved { display: flex; align-items: center; gap: 1px; margin-right: 3px; }
.mini em { position: absolute; right: 0; top: 0; min-width: 13px; height: 13px; padding: 0 2px; color: var(--cnt-ink); font: 600 8.5px/13px var(--font); font-style: normal; text-align: center; background: var(--cnt); border-radius: 7px; }
.mini { position: relative; }
.tray-in:not([data-tray="sticky"]) .swatch { display: none; }
.tray-c, .tray-s { display: none; align-items: center; gap: 2px; }
.tray-in[data-tray="comment"] .tray-c, .tray-in[data-tray="sel"] .tray-s { display: flex; }
.tray-c { gap: 8px; }
.tray-hint { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.tray-c .seg { flex: none; margin: 0; }
.tray-c .seg button { height: 24px; font-size: 11.5px; }
.tray-s .ask { height: 32px; font-size: 12.5px; }
.tray-s .ask .ic { width: 16px; height: 16px; }
.tray { width: 0; overflow: hidden; }
.tray-in { display: flex; align-items: center; gap: 4px; width: max-content; height: 36px; padding: 0 2px 0 6px; }
.swatch { width: 24px; height: 24px; border-radius: 7px 7px 11px 7px; box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .1); opacity: 0; transform: scale(.4); transition: transform .42s var(--spring-pop), opacity .2s; }
.tray.open .swatch { opacity: 1; transform: none; }
.tray.open .swatch:nth-child(2) { transition-delay: .03s; }
.tray.open .swatch:nth-child(3) { transition-delay: .06s; }
.tray.open .swatch:nth-child(4) { transition-delay: .09s; }
.swatch.on { box-shadow: 0 0 0 1.5px var(--raised), 0 0 0 3px var(--ink); }
.chip { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 6px 0 10px; color: var(--ink); border-radius: 10px; white-space: nowrap; transition: background-color .16s; }
.chip:hover { background: var(--hover); }
.chip .ic { width: 12px; height: 12px; color: var(--ink-3); stroke-width: 1.8; }
.ask { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 7px 0 8px; color: var(--ink-2); white-space: nowrap; border-radius: 10px; transition: background-color .16s, color .16s; }
.ask:hover { color: var(--ink); background: var(--hover); }
.ask .ic { width: 18px; height: 18px; }
.ask span { margin-right: 2px; }
.ask .keys { display: flex; gap: 3px; }

.tip { position: absolute; left: 0; z-index: 41; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 6px 0 10px; color: var(--ink); font-size: 12px; white-space: nowrap; background: var(--solid); border-radius: 10px; box-shadow: var(--sh-pop); opacity: 0; pointer-events: none; transition: opacity .14s; }
.tip.on { opacity: 1; }
.tip .keys { display: flex; gap: 3px; }
.tip kbd { height: 18px; min-width: 18px; font-size: 10.5px; }

.pop { position: absolute; z-index: 41; width: 196px; padding: 5px; background: var(--raised); border-radius: 14px; box-shadow: var(--sh-pop); opacity: 0; transform: translate(-50%, 8px) scale(.96); transform-origin: 50% 100%; pointer-events: none; transition: opacity .14s, transform .38s var(--spring-pop); }
.pop.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.pop button { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 6px 0 9px; border-radius: 9px; }
.pop button span { flex: 1; text-align: left; }
.pop-pill { position: absolute; left: 0; top: 0; background: var(--on); border-radius: 9px; }

.ghost { position: fixed; left: 0; top: 0; z-index: 90; display: none; pointer-events: none; }
.ghost.on { display: block; }
.ghost .pin { position: static; opacity: .92; }
.ghost .gs { width: 34px; height: 34px; border-radius: 3px 3px 12px 3px; box-shadow: 0 8px 14px -6px rgb(0 0 0 / .3); transform: rotate(-4deg); }

.cmd { position: absolute; left: 50%; bottom: 0; display: grid; grid-template-rows: 58px 38px minmax(0, 1fr) 46px; overflow: hidden; }
.cmd-top { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--hair); }
.cmd-top .ic { color: var(--ink-3); }
.cmd-top input { flex: 1; min-width: 0; font: var(--pl-w) var(--input-s)/1.3 var(--title); letter-spacing: var(--title-ls); user-select: text; }
.cmd-top input::placeholder { color: var(--ink-3); }
.cmd-body { display: grid; grid-template-columns: minmax(0, 1fr) 248px; min-height: 0; }
.cmd-list { position: relative; min-height: 0; padding: 6px 8px; overflow: hidden auto; scrollbar-width: none; }
.cmd-sel { position: absolute; left: 0; top: 0; background: var(--on); border-radius: 12px; pointer-events: none; }
.cmd-group { padding: 10px 10px 4px; color: var(--ink-3); font-size: 11.5px; }
.cmd-group:first-of-type { padding-top: 6px; }
.cr { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 10px 0 7px; text-align: left; border-radius: 12px; }
.cr .tile { flex: none; display: grid; place-items: center; width: 30px; height: 30px; color: var(--ink-2); background: var(--hover); border-radius: 9px; }
.cr .tile .ic { width: 16px; height: 16px; }
.cr .tile.sw { box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .08); }
.cr .t { flex: 1; min-width: 0; }
.cr .t b { display: block; overflow: hidden; font-weight: 450; text-overflow: ellipsis; white-space: nowrap; }
.cr .t small { display: block; overflow: hidden; color: var(--ink-3); font-family: var(--meta); font-size: var(--meta-s); letter-spacing: var(--meta-ls); text-overflow: ellipsis; white-space: nowrap; }
.cr mark { color: inherit; font-weight: 600; background: none; box-shadow: inset 0 -1.5px 0 var(--ink); }
.cr .r { display: flex; flex: none; align-items: center; gap: 3px; color: var(--ink-3); font-size: 11.5px; }
.cmd-none { padding: 26px 16px; color: var(--ink-3); text-align: center; }
.cmd-preview { display: flex; flex-direction: column; gap: 10px; min-height: 0; padding: 12px 12px 12px 4px; overflow: hidden; }
.thumb { position: relative; flex: none; height: 174px; overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 .5px var(--hair-2); }
.thumb .doc { width: 780px; min-height: 620px; padding: 40px 54px; transform: scale(.298); transform-origin: 0 0; animation: none; pointer-events: none; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; padding: 0 2px; font-family: var(--meta); font-size: var(--meta-s); letter-spacing: var(--meta-ls); }
.meta dt { color: var(--ink-3); }
.meta dd { margin: 0; overflow: hidden; color: var(--ink); text-overflow: ellipsis; white-space: nowrap; }
.pv-title { padding: 0 2px; font-weight: 500; text-wrap: balance; }
.pv-text { padding: 0 2px; color: var(--ink-2); font-size: 12.5px; line-height: 1.45; text-wrap: pretty; }
/* Słowo kluczowe zamienia się w żeton */
.cmd-chips { display: flex; flex: none; gap: 4px; max-width: 58%; overflow: hidden; }
.cmd-filters { display: flex; align-items: center; gap: 4px; height: 38px; padding: 0 12px 0 14px; overflow: hidden; border-bottom: 1px solid var(--hair); }
.f-chip { display: inline-flex; flex: none; align-items: center; gap: 2px; height: 28px; padding: 0 3px 0 9px; color: var(--ink); font-size: 12px; white-space: nowrap; background: var(--on); border-radius: 9px; animation: chip-in .38s var(--spring-pop) both; }
.f-chip b { margin-right: 3px; color: var(--ink-3); font-weight: 400; }
.f-chip button { display: grid; place-items: center; width: 20px; height: 20px; color: var(--ink-3); border-radius: 6px; }
.f-chip button:hover { color: var(--ink); background: var(--hover); }
.f-chip .ic { width: 12px; height: 12px; stroke-width: 1.8; }
@keyframes chip-in { from { opacity: 0; transform: scale(.78); } to { opacity: 1; transform: none; } }
.f-add { flex: none; height: 24px; padding: 0 8px; color: var(--ink-2); font-size: 12px; white-space: nowrap; border-radius: 7px; box-shadow: inset 0 0 0 .5px var(--hair-2); transition: color .16s, background-color .16s; }
.f-add:hover { color: var(--ink); background: var(--hover); }
.f-add.on { color: var(--ink); background: var(--on); }
.f-note { flex: none; margin-right: 4px; color: var(--ink-3); font-size: 12px; white-space: nowrap; }

/* Dok przy ekranie startowym kurczy się do samego szukania */
.bar-ctx { flex: none; overflow: hidden; }
.bar-ctx-in { display: flex; align-items: center; gap: 4px; width: max-content; height: 52px; }

/* Ekran startowy: warstwa na ścianie, pod arkuszami */
.home { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; visibility: hidden; transition: opacity .24s, visibility 0s .24s; }
.home.on { opacity: 1; visibility: visible; transition: opacity .34s .05s; }
.h-head { position: relative; z-index: 3; flex: none; display: flex; align-items: baseline; gap: 8px; width: 100%; max-width: 1040px; height: 36px; margin: 0 auto; padding: 0 4px; line-height: 36px; white-space: nowrap; }
.h-head b { font: var(--pl-w) var(--pl-s)/36px var(--title); letter-spacing: var(--title-ls); }
.h-head > span { color: var(--ink-3); font-family: var(--meta); font-size: var(--meta-s); letter-spacing: var(--meta-ls); }
.h-head .view-seg { align-self: center; margin: 0 0 0 6px; transition: opacity .3s; }
.home.setup .h-head { visibility: hidden; }
.home.scan .h-head .view-seg { opacity: 0; pointer-events: none; }
.h-body { position: relative; flex: 1; min-height: 0; margin: -6px -12px 0; overflow: hidden auto; scrollbar-width: none; }

<script>
(() => {
'use strict';

/* ---------- Narzędzia ---------- */
const root = document.documentElement;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const isMac = /Mac/.test(navigator.platform);
const MOD = isMac ? '⌘' : 'Ctrl';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const slowMo = Number(new URLSearchParams(location.search).get('slow')) || 1;
const ic =(n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
const keys = (list) => list.map((k) => `<kbd>${k}</kbd>`).join('');
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, one, few, many) => {
  if (n === 1) return one;
  const a = n % 10, b = n % 100;
  return a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
};
const rectIn = (el, box) => {
  const a = el.getBoundingClientRect(), b = box.getBoundingClientRect();
  return { x: a.left - b.left + box.scrollLeft, y: a.top - b.top + box.scrollTop, w: a.width, h: a.height };
};

/* Prawdziwa krzywa sprężyny dla przejść CSS */
function springCurve(k, z, seconds = 1) {
  let x = 0, v = 0;
  const c = 2 * z * Math.sqrt(k), dt = 1 / 240, steps = Math.round(seconds / dt), every = Math.round(steps / 56), out = [];
  for (let i = 0; i <= steps; i++) {
    if (i % every === 0) out.push(+x.toFixed(4));
    v += (k * (1 - x) - c * v) * dt;
    x += v * dt;
  }
  out[out.length - 1] = 1;
  return `linear(${out.join(',')})`;
}
if (CSS.supports('transition-timing-function', 'linear(0, 1)')) {
  root.style.setProperty('--spring', springCurve(120, .92));
  root.style.setProperty('--spring-pop', springCurve(170, .62));
}

/* ---------- Silnik ruchu ---------- */
const bodies = new Set();
const pills = new Set();
let raf = 0, lastT = 0, followUntil = 0, follow = null;

class Spring {
  constructor(x = 0, k = 180, z = .82) { this.x = this.t = x; this.v = 0; this.k = k; this.z = z; bodies.add(this); }
  to(t, o = {}) { if (o.k) this.k = o.k; if (o.z) this.z = o.z; if (o.v !== undefined) this.v = o.v; this.t = t; wake(); return this; }
  set(x) { this.x = this.t = x; this.v = 0; wake(); return this; }
  step(h) { const c = 2 * this.z * Math.sqrt(this.k); this.v += (this.k * (this.t - this.x) - c * this.v) * h; this.x += this.v * h; }
  snap() { this.x = this.t; this.v = 0; }
  get rest() { return Math.abs(this.t - this.x) < .002 && Math.abs(this.v) < .02; }
}

function wake() { if (!raf) raf = requestAnimationFrame(tick); }
function tick(now) {
  raf = 0;
  const gap = now - lastT;
  lastT = now;
  if (reduced) {
    bodies.forEach((b) => b.snap());
  } else {
    const dt = (gap > 64 ? 1 / 60 : gap / 1000) * slowMo, h = 1 / 240;
    for (let t = 0; t < dt; t += h) bodies.forEach((b) => b.step(h));
  }
  if (now < followUntil && follow) follow();
  render();
  let moving = now < followUntil;
  if (!moving) for (const b of bodies) if (!b.rest) { moving = true; break; }
  if (moving) { wake(); return; }
  bodies.forEach((b) => b.snap());
  render();
  settle();
}

/* Krawędź jak lina: najbliższy punkt rusza pierwszy, dalsze podążają, a sąsiedzi wygładzają kształt */
class Rope {
  constructor(path, side, geom) {
    this.path = path; this.side = side; this.geom = geom;
    this.n = 17; this.xs = new Float64Array(this.n); this.vs = new Float64Array(this.n);
    this.target = 0; this.pull = .05; this.k = 235; this.z = .64; this.couple = 1300;
    this.bump = new Spring(0, 340, .62); this.bumpY = 0; this.T = 0; this.B = 1;
    bodies.add(this);
  }
  place(x) { this.xs.fill(x); this.vs.fill(0); this.target = x; }
  setPull(y) { const { top, bottom } = this.geom(); this.pull = clamp((y - top) / (bottom - top)); }
  to(x, pullY) { if (pullY !== undefined) this.setPull(pullY); this.target = x; wake(); }
  step(h) {
    const { n, xs, vs, target, pull, k, z, couple } = this;
    for (let i = 0; i < n; i++) {
      const d = Math.abs(i / (n - 1) - pull);
      const ki = k * (1 - .64 * d);
      const c = 2 * (z + .1 * d) * Math.sqrt(ki);
      const lap = (i ? xs[i - 1] : xs[i]) + (i < n - 1 ? xs[i + 1] : xs[i]) - 2 * xs[i];
      vs[i] += (ki * (target - xs[i]) - c * vs[i] + couple * lap) * h;
    }
    for (let i = 0; i < n; i++) xs[i] += vs[i] * h;
  }
  snap() { this.xs.fill(this.target); this.vs.fill(0); }
  get rest() {
    for (let i = 0; i < this.n; i++) if (Math.abs(this.xs[i] - this.target) > .08 || Math.abs(this.vs[i]) > .6) return false;
    return true;
  }
  get mean() { return (this.xs[0] + this.xs[this.n - 1]) / 2; }
  edgeAt(y) {
    const u = clamp((y - this.T) / Math.max(1, this.B - this.T)) * (this.n - 1);
    const i = Math.floor(u), j = Math.min(i + 1, this.n - 1);
    return lerp(this.xs[i], this.xs[j], u - i);
  }
  render() {
    const { base, top, bottom, r } = this.geom();
    const s = this.side === 'right' ? 1 : -1, n = this.n, f = (v) => v.toFixed(2), K = .42;
    const R = Math.min(r, Math.abs(this.mean - base) / 2);
    const T = top + R, B = bottom - R;
    this.T = T; this.B = B;
    const pts = [];
    for (let i = 0; i < n; i++) {
      const y = T + (B - T) * i / (n - 1), dy = (y - this.bumpY) / 62;
      pts.push([this.xs[i] + s * this.bump.x * Math.exp(-dy * dy), y]);
    }
    const a = pts[0], z = pts[n - 1];
    let d = `M${f(base + s * R)} ${f(top)}L${f(a[0] - s * R)} ${f(top)}C${f(a[0] - s * R * K)} ${f(top)} ${f(a[0])} ${f(top + R * K)} ${f(a[0])} ${f(T)}`;
    for (let i = 0; i < n - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    d += `C${f(z[0])} ${f(bottom - R * K)} ${f(z[0] - s * R * K)} ${f(bottom)} ${f(z[0] - s * R)} ${f(bottom)}L${f(base + s * R)} ${f(bottom)}C${f(base + s * R * K)} ${f(bottom)} ${f(base)} ${f(bottom - R * K)} ${f(base)} ${f(B)}L${f(base)} ${f(T)}C${f(base)} ${f(top + R * K)} ${f(base + s * R * K)} ${f(top)} ${f(base + s * R)} ${f(top)}Z`;
    this.path.setAttribute('d', d);
    this.path.style.opacity = clamp(Math.abs(this.mean - base) / 10);
  }
}

/* Znacznik wyboru: krawędź w stronę ruchu jest szybka, tylna wolna, więc w ruchu się rozciąga */
class Pill {
  constructor(el, axis = 'y', o = {}) {
    this.el = el; this.axis = axis;
    this.fast = o.fast || 640; this.slow = o.slow || 250; this.z = o.z || .86;
    this.a = new Spring(0); this.b = new Spring(0); this.c0 = 0; this.c1 = 0; this.on = false;
    pills.add(this);
  }
  to(r, instant) {
    const [a, b, c0, c1] = this.axis === 'y' ? [r.y, r.y + r.h, r.x, r.w] : [r.x, r.x + r.w, r.y, r.h];
    this.c0 = c0; this.c1 = c1;
    if (instant || !this.on) { this.a.set(a); this.b.set(b); this.on = true; this.el.style.opacity = 1; return; }
    const forward = a + b > this.a.t + this.b.t;
    this.a.to(a, { k: forward ? this.slow : this.fast, z: this.z });
    this.b.to(b, { k: forward ? this.fast : this.slow, z: this.z });
    this.el.style.opacity = 1;
  }
  hide() { this.on = false; this.el.style.opacity = 0; }
  render() {
    const a = this.a.x, b = Math.max(a, this.b.x), s = this.el.style;
    if (this.axis === 'y') { s.transform = `translate(${this.c0}px,${a}px)`; s.width = `${this.c1}px`; s.height = `${b - a}px`; }
    else { s.transform = `translate(${a}px,${this.c0}px)`; s.width = `${b - a}px`; s.height = `${this.c1}px`; }
  }
}

/* Jeden arkusz zajmuje scenę, dwa to para z uchwytem, trzy i więcej to szereg z kamerą.
   Zerknięcie wisi nad każdym z tych układów i niczego nie przelewa. */
const PAIR_GAP = 10, ROW_GAP = 18, PEEK_W = .58, OFF = 24;
const OPEN = { k: 170, z: .74 }, SHUT = { k: 240, z: .9 };
const rowWidth = (w) => Math.max(480, w * .64);
const isOpen = (i) => state.peek === i || (!state.home && state.order.includes(i));
const pinned = () => state.order.length;
const openPane = (id) => state.panes.findIndex((d, i) => d === id && isOpen(i));

function sheetRects(w) {
  const r = sheets.map((s) => ({ l: s.l, w: s.w })), n = state.home ? 0 : pinned();
  if (n === 1) r[state.order[0]] = { l: 0, w };
  if (n === 2) {
    const side = (w - PAIR_GAP) * (1 - ratio.x);
    r[state.order[0]] = { l: 0, w: w - PAIR_GAP - side };
    r[state.order[1]] = { l: w - side, w: side };
  }
  if (n > 2) {
    const W = rowWidth(w);
    state.order.forEach((p, i) => { r[p] = { l: i * (W + ROW_GAP) - camX.x, w: W }; });
  }
  if (state.peek !== null) r[state.peek] = { l: w * (1 - PEEK_W), w: w * PEEK_W };
  return r;
}
/* Zmiana układu zapisuje różnicę, a sprężyna ją gasi. Układ dalej idzie wiernie za sceną,
   a przerwane przejście zachowuje prędkość. */
function reflow(change, o = OPEN) {
  const w = sR.x - sL.x, before = sheetRects(w);
  change();
  const after = sheetRects(w);
  sheets.forEach((s, i) => {
    const open = isOpen(i);
    if (open && s.o.x < .02) {
      s.dl.x = w + OFF - after[i].l; s.dl.v = 0;
      s.dw.x = 0; s.dw.v = 0;
    } else {
      s.dl.x += before[i].l - after[i].l;
      s.dw.x += before[i].w - after[i].w;
    }
    s.dl.to(0, o);
    s.dw.to(0, o);
    s.o.to(open ? 1 : 0);
  });
}
function layoutSheets(w) {
  const rects = sheetRects(w);
  sheets.forEach((s, i) => {
    const r = rects[i];
    if (isOpen(i)) { s.l = r.l; s.w = r.w; }
    s.x = r.l + s.dl.x;
    /* Przestrzelenie ciągnie tylko krawędź prowadzącą: prawy brzeg zostaje przy ścianie */
    s.wide = Math.max(0, r.w + s.dw.x + (s.dl.x < 0 && r.l + r.w > w - 1 ? -s.dl.x : 0));
    s.el.style.left = `${s.x}px`;
    s.el.style.width = `${s.wide}px`;
    s.el.style.opacity = clamp(s.o.x * 1.6);
    s.el.style.visibility = s.o.x < .01 ? 'hidden' : 'visible';
  });
  /* Tytuł gaśnie tam, gdzie zachodzi na niego zerknięcie, także w drodze do przypięcia */
  const top = sheets.find((s) => s.floating && s.o.x > .01);
  sheets.forEach((s) => {
    if (s.floating && state.peek !== s.i && isOpen(s.i) && Math.abs(s.dl.x) + Math.abs(s.dw.x) < 12) s.floating = false;
    const edge = !top || s === top || (state.peek === null && s.x >= top.x) ? Infinity : top.x - s.x - 8;
    const over = s.wide - edge;

  handle.style.opacity = calm;

function hang(instant) {

  const sheet = $('.pane.focused .sheet'), list = $('#threads'), top = list.getBoundingClientRect().top, H = list.clientHeight;

  for (let i = at + 1; i < cards.length; i++) cards[i].y = Math.max(cards[i].want, cards[i - 1].y + cards[i - 1].h + 8);
  for (let i = at - 1; i >= 0; i--) cards[i].y = Math.min(cards[i].want, cards[i + 1].y - cards[i].h - 8);
  for (const c of cards) {
    const y = clamp(c.y, 24 - c.h, H - 24), spring = hangs.get(c.id).y;
    if (instant) spring.set(y); else spring.to(y);
  }
}

/* Zerknięcie: Ctrl + klik albo Ctrl Enter, układ pod spodem zostaje bez zmian */
function peekDoc(id) {

/* Przypięty arkusz staje obok tego, z którego na niego zerknięto */

  const at = state.order.indexOf(i);
  reflow(() => {
    state.order.splice(at, 1);
    const next = state.order[Math.min(at, pinned() - 1)];
    if (state.focus === i) state.focus = next;
    if (state.back === i) state.back = next;
  });

/* Ctrl \\: zerknięcie przypina, kilka arkuszy składa do bieżącego, a kolejne naciśnięcie rozkłada je z powrotem */
function splitKey() {
  if (state.peek !== null) { pinPeek(); return; }
  if (state.home) return;
  if (pinned() > 1) {
    state.stash = { order: [...state.order], docs: state.order.map((i) => state.panes[i]) };
    reflow(() => { state.order = [state.focus]; }, SHUT);

  const stash = state.stash, me = state.panes[state.focus];

  if (back.length > 1 && back.includes(state.focus)) {
    back.forEach((i) => {

const unique = (list) => [...new Set(list)];
const FILTERS = {
  project: { label: 'Projekt', op: 'projekt', name: (v) => v, values: () => unique(Object.values(DOCS).map((d) => d.project)) },
  status: { label: 'Status', op: 'status', name: (v) => STATUS[v].label, values: () => Object.keys(STATUS) },
  branch: { label: 'Gałąź', op: 'gałąź', name: (v) => v, values: () => unique(Object.values(DOCS).map((d) => d.branch).filter(Boolean)) },
  kind: { label: 'Rodzaj', op: 'rodzaj', name: (v) => ({ doc: 'Dokumenty', note: 'Uwagi', action: 'Akcje' }[v]), values: () => ['doc', 'note', 'action'] }
};
const filterCount = (key, v) => {
  if (key !== 'kind') return Object.values(DOCS).filter((d) => d[key] === v).length;
  return v === 'doc' ? Object.keys(DOCS).length : v === 'note' ? NOTES.filter((n) => n.status === 'open').length : ACTIONS.length;
};
const DIA = { ą: 'a', ć: 'c', ę: 'e', ł: 'l', ń: 'n', ó: 'o', ś: 's', ź: 'z', ż: 'z' };
const norm = (s) => s.toLowerCase().replace(/[ąćęłńóśźż]/g, (c) => DIA[c]);
const plain = (h) => h.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();

const filterKey = (op) => (op ? Object.keys(FILTERS).find((k) => norm(FILTERS[k].op).startsWith(norm(op))) : undefined);

function resetSearch() {
  cmdF = emptyFilters();
  cmdOrder = [];
  cmdPick = null;
  cmdQuery = '';
  input.value = '';
  renderChips();
}
function addFilter(key, v) {
  cmdF[key].add(v);
  cmdOrder.push([key, v]);
  cmdPick = null;
  cmdQuery = '';
  input.value = '';
  renderChips();
  renderCmd();
}
function dropFilter(key, v) {
  cmdF[key].delete(v);
  cmdOrder = cmdOrder.filter(([k, x]) => !(k === key && x === v));
  renderChips();
  renderCmd();
}
function renderChips() {
  $('#cmdChips').innerHTML = cmdOrder.map(([k, v]) => `<span class="f-chip"><b>${FILTERS[k].label}</b>${esc(FILTERS[k].name(v))}<button data-drop="${k}" data-v="${esc(v)}" aria-label="Usuń filtr">${ic('x')}</button></span>`).join('');
}
function renderFilterRow() {
  $('#cmdFilters').innerHTML = `<span class="f-note">Dodaj filtr</span>${Object.entries(FILTERS).map(([k, f]) => `<button class="f-add ${cmdPick && cmdPick.key === k ? 'on' : ''}" data-add="${k}">${f.label}</button>`).join('')}`;
}

function fuzzy(q, text) {
  if (!q) return 0;
  const t = norm(text), i = t.indexOf(q);
  if (i >= 0) return i;
  let p = 0;
  for (const c of t) if (c === q[p]) p++;
  return p === q.length ? 500 : -1;
}

function hl(text, q) {
  if (!q) return esc(text);
  const i = norm(text).indexOf(q);
  if (i < 0) return esc(text);
  return `${esc(text.slice(0, i))}<mark>${esc(text.slice(i, i + q.length))}</mark>${esc(text.slice(i + q.length))}`;
}

function snippet(html, q) {
  const t = plain(html), i = norm(t).indexOf(q);
  if (i < 0) return null;
  const a = Math.max(0, i - 24);
  return { text: `${a ? '…' : ''}${t.slice(a, i + q.length + 44)}…` };
}

function buildCmd() {
  if (cmdPick) {
    const f = FILTERS[cmdPick.key], q = norm(cmdPick.q);
    const rows = f.values().filter((v) => norm(f.name(v)).includes(q)).map((v) => ({ type: 'value', key: cmdPick.key, v, count: filterCount(cmdPick.key, v) }));
    return rows.length ? [{ group: f.label }, ...rows] : [];
  }
  const f = cmdF, q = norm(cmdQuery.trim()), out = [];
  const docFilter = f.project.size || f.status.size || f.branch.size;
  const narrowed = q || docFilter || f.kind.size;
  const want = (t) => !f.kind.size || f.kind.has(t);
  const pass = (d) => (!f.project.size || f.project.has(d.project)) && (!f.status.size || f.status.has(d.status)) && (!f.branch.size || f.branch.has(d.branch));
  if (want('doc')) {
    let list = Object.values(DOCS).filter(pass).map((d) => {
      const s = fuzzy(q, `${d.title} ${d.project} ${d.branch || ''}`);
      const body = q.length >= 3 && s < 0 ? snippet(d.html, q) : null;
      return { type: 'doc', d, score: s >= 0 ? s : body ? 700 : -1, body };
    }).filter((x) => x.score >= 0).sort((a, b) => a.score - b.score);
    if (!narrowed) list = list.slice(0, 4);
    if (list.length) out.push({ group: narrowed ? 'Dokumenty' : 'Ostatnie' }, ...list);
  }
  if (want('note')) {
    let list = NOTES.filter((n) => n.status === 'open' && pass(DOCS[n.doc])).map((n) => ({ type: 'note', n, score: fuzzy(q, n.msgs.map((m) => m.text).join(' ')) })).filter((x) => x.score >= 0);
    if (!narrowed) list = list.slice(0, 2);
    if (list.length) out.push({ group: 'Uwagi' }, ...list);
  }
  if (want('action') && !docFilter) {
    let list = ACTIONS.map((a) => ({ type: 'action', a, score: fuzzy(q, `${a.title} ${a.sub}`) })).filter((x) => x.score >= 0).sort((a, b) => a.score - b.score);
    if (!narrowed) list = list.slice(0, 5);
    if (list.length) out.push({ group: 'Akcje' }, ...list);
  }
  return out;
}

function cmdRow(it, i) {
  const q = norm(cmdQuery.trim());
  if (it.type === 'value') {
    const tile = it.key === 'status' ? `<i class="dot ${STATUS[it.v].tone}"></i>` : ic(it.key === 'project' ? 'folder' : it.key === 'branch' ? 'branch' : 'layers');
    return `<button class="cr" data-i="${i}"><span class="tile">${tile}</span><span class="t"><b>${esc(FILTERS[it.key].name(it.v))}</b></span><span class="r">${it.count}</span></button>`;
  }
  if (it.type === 'doc') {
    const sub = it.body ? esc(it.body.text) : esc(`${it.d.project}${it.d.branch ? ` · ${it.d.branch}` : ''} · ${it.d.time}`);
    const s = STATUS[it.d.status];
    return `<button class="cr" data-i="${i}"><span class="tile">${ic('file')}</span><span class="t"><b>${hl(it.d.title, q)}</b><small>${sub}</small></span><span class="r"><i class="dot ${s.tone}"></i></span></button>`;
  }
  if (it.type === 'note') {
    const tile = it.n.kind === 'sticky' ? `<span class="tile sw ${it.n.color}"></span>` : `<span class="tile">${ic('comment')}</span>`;
    return `<button class="cr" data-i="${i}">${tile}<span class="t"><b>${hl(it.n.msgs[0].text, q)}</b><small>${esc(DOCS[it.n.doc].title)}</small></span></button>`;
  }
  return `<button class="cr" data-i="${i}"><span class="tile">${ic(it.a.icon)}</span><span class="t"><b>${hl(it.a.title, q)}</b></span><span class="r">${keys(it.a.keys)}</span></button>`;
}

function renderCmd() {
  if (state.map) return;
  const all = buildCmd();
  cmdItems = all.filter((x) => !x.group);
  let i = 0;
  $('#cmdRows').innerHTML = all.map((x) => (x.group ? `<div class="cmd-group">${x.group}</div>` : cmdRow(x, i++))).join('') || '<p class="cmd-none">Nic nie pasuje. Spróbuj innego słowa.</p>';
  cmdIdx = 0;
  showCount();
  $('#cmdList').scrollTop = 0;
  cmdSelect(0, true);
  renderFilterRow();
}

function cmdSelect(i, instant) {
  if (!cmdItems.length) { cmdPill.hide(); $('#cmdPreview').innerHTML = ''; $('#cmdHints').innerHTML = ''; return; }
  cmdIdx = clamp(i, 0, cmdItems.length - 1);
  const row = $(`.cr[data-i="${cmdIdx}"]`);
  const list = $('#cmdList'), r = rectIn(row, list);
  if (r.y < list.scrollTop + 4) list.scrollTop = Math.max(0, r.y - 30);
  else if (r.y + r.h > list.scrollTop + list.clientHeight - 4) list.scrollTop = r.y + r.h - list.clientHeight + 6;
  cmdPill.to(rectIn(row, list), instant);
  renderPreview(cmdItems[cmdIdx]);
}

function renderPreview(it) {
  const p = $('#cmdPreview'), h = $('#cmdHints');
  const hint = (k, t) => `<span class="act">${keys(k)}<span>${t}</span></span>`;
  if (it.type === 'value') {
    p.innerHTML = `<p class="pv-title">${esc(FILTERS[it.key].name(it.v))}</p><p class="pv-text">${it.count} ${plural(it.count, 'wynik', 'wyniki', 'wyników')}</p>`;
    h.innerHTML = hint(['↵'], 'Dodaj filtr');
    return;
  }
  const acts = hint([MOD, 'K'], 'Akcje');
  if (it.type === 'doc') {
    const d = it.d;
    p.innerHTML = `<div class="thumb"><article class="doc ${d.theme}"><div class="inner">${d.html}</div></article></div>
      <dl class="meta"><dt>Projekt</dt><dd>${d.project}</dd>${d.branch ? `<dt>Branch</dt><dd>${d.branch}</dd>` : ''}${d.pr ? `<dt>PR</dt><dd>#${d.pr}</dd>` : ''}<dt>Status</dt><dd>${STATUS[d.status].label}</dd><dt>Zmieniono</dt><dd>${d.time}</dd></dl>`;
    h.innerHTML = hint(['↵'], 'Otwórz') + acts;
  } else if (it.type === 'note') {
    const n = it.n;
    p.innerHTML = `<p class="pv-title">${esc(DOCS[n.doc].title)}</p>${n.msgs.map((m) => `<p class="pv-text"><b style="font-weight:500">${m.who === 'agent' ? 'Agent' : 'Ty'}:</b> ${esc(m.text)}</p>`).join('')}`;
    h.innerHTML = hint(['↵'], 'Pokaż w dokumencie') + acts;
  } else {
    p.innerHTML = `<p class="pv-title">${esc(it.a.title)}</p><p class="pv-text">${esc(it.a.sub)}</p>`;
    h.innerHTML = hint(['↵'], 'Uruchom') + acts;
  }
}

function itemActions(it) {
  if (it.type === 'doc') {
    const d = it.d;
    return [
      { icon: 'file', title: 'Otwórz', keys: ['↵'], run: () => runCmd(false) },
      { icon: 'split', title: 'Otwórz obok', keys: [MOD, '↵'], run: () => runCmd(true) },
      { icon: 'reveal', title: 'Pokaż w Eksploratorze', keys: [MOD, 'Shift', 'F'], run: () => { closeActs(); flash('Otwarto w Eksploratorze'); } },
      { icon: 'file', title: 'Kopiuj ścieżkę', keys: [MOD, 'Shift', 'C'], run: () => { navigator.clipboard?.writeText(d.path).catch(() => {}); closeActs(); flash('Skopiowano ścieżkę'); } },
      { group: 'Status' },
      ...Object.entries(STATUS).map(([id, st]) => ({ dot: st.tone, title: st.label, check: d.status === id, run: () => { setStatus(id, d); const i = cmdIdx; closeActs(); renderCmd(); cmdSelect(i, true); } }))
    ];
  }
  if (it.type === 'note') {
    const n = it.n;
    return [
      { icon: 'bubble', title: 'Pokaż w dokumencie', keys: ['↵'], run: () => runCmd(false) },
      { icon: 'check', title: 'Zamknij uwagę', run: () => { n.status = 'resolved'; closeActs(); renderCmd(); renderInsp(); syncDock(); } }
    ];
  }
  if (it.type === 'action') return [{ icon: it.a.icon, title: 'Uruchom', keys: ['↵'], run: () => runCmd(false) }];
  return [];
}
let flashTimer = 0;
function showCount() {
  $('#cmdCount').textContent = `${cmdItems.length} ${plural(cmdItems.length, 'wynik', 'wyniki', 'wyników')}`;
}
function flash(text) {
  $('#cmdCount').textContent = text;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(showCount, 1800);
}
/* Skrót akcji działa także wtedy, gdy panel jest zamknięty */
function runChord(e) {
  const chord = [e.ctrlKey || e.metaKey ? MOD : '', e.shiftKey ? 'Shift' : '', e.key === 'Enter' ? '↵' : e.key.toUpperCase()].filter(Boolean).join(' ');
  const hit = itemActions(cmdItems[cmdIdx] || {}).find((a) => a.keys && a.keys.length > 1 && a.keys.join(' ') === chord);
  if (!hit) return false;
  e.preventDefault();
  hit.run();
  return true;
}
function renderActs() {
  const all = itemActions(cmdItems[cmdIdx] || {}), q = norm($('#actInput').value.trim());
  const shown = all.filter((a, i) => (a.group ? all.slice(i + 1).some((b) => !b.group && norm(b.title).includes(q)) : norm(a.title).includes(q)));
  actItems = shown.filter((a) => !a.group);
  let i = 0;
  $('#actRows').innerHTML = shown.map((a) => {
    if (a.group) return `<div class="ar-group">${a.group}</div>`;
    const lead = a.dot !== undefined ? `<i class="dot ${a.dot}"></i>` : ic(a.icon);
    return `<button class="ar" data-a="${i++}" role="menuitem">${lead}<span>${a.title}</span><i class="keys">${a.check ? ic('check') : keys(a.keys || [])}</i></button>`;
  }).join('');
  actSelect(0, true);
}
function actSelect(i, instant) {
  if (!actItems.length) { actPill.hide(); return; }
  actIdx = clamp(i, 0, actItems.length - 1);
  const row = $(`.ar[data-a="${actIdx}"]`), box = $('#actBox');
  const r = { x: row.offsetLeft, y: row.offsetTop, w: row.offsetWidth, h: row.offsetHeight };
  if (r.y < box.scrollTop) box.scrollTop = r.y;
  else if (r.y + r.h > box.scrollTop + box.clientHeight) box.scrollTop = r.y + r.h - box.clientHeight;
  actPill.to(r, instant);
}
function openActs() {
  const it = cmdItems[cmdIdx];
  if (!it || it.type === 'value') return;
  state.acts = true;
  $('#actInput').value = '';
  renderActs();
  $('#cmdActs').classList.add('on');
  $('#actInput').focus();
}
function closeActs() {
  if (!state.acts) return;
  state.acts = false;
  $('#cmdActs').classList.remove('on');
  if (state.cmd) input.focus();
}

function runCmd(beside) {
  const it = cmdItems[cmdIdx];
  if (!it) return;
  if (it.type === 'value') { addFilter(it.key, it.v); return; }
  closeCmd();
  if (it.type === 'doc') {
    if (beside) peekDoc(it.d.id); else openDoc(it.d.id);
  } else if (it.type === 'note') {
    openDoc(it.n.doc);
    setSelNote(it.n.id);
  } else it.a.run();
}

function openCmd() {
  if (state.cmd) return;
  state.cmd = true;
  hideTip(); togglePop(false); hideFly(); hideCaps();
  if (cmd.dataset.view) setMap(false);
  resetSearch();
  renderCmd();
  mW.to(1, { k: 250, z: .8 });
  mH.to(1, { k: 190, z: .74 });
  scrim.style.pointerEvents = 'auto';
  cmd.style.visibility = 'visible';
  input.focus();
  requestAnimationFrame(renderCmd);
}
function closeCmd() {
  if (!state.cmd) return;
  closeActs();
  state.cmd = false;
  state.map = false;
  mW.to(0, { k: 300, z: .88 });
  mH.to(0, { k: 280, z: .9 });
  scrim.style.pointerEvents = 'none';
  input.blur();
}

const footHint = (k, t) => `<span class="act">${keys(k)}<span>${t}</span></span>`;

}
/* Ściąga: wiersze zostają na miejscu, a filtr przygasza resztę, żeby nie burzyć pamięci przestrzennej */
function renderList() {

  $('#cmdMap').innerHTML = `<div class="km">${KEYMAP.map((g) => `<section class="km-group"><h3>${g.group}</h3>${g.items.map((it) => `<div class="km-row" data-q="${esc(norm(`${it.title} ${it.keys.join(' ')}`))}" style="--n:${n++}">${ic(it.icon)}<span>${it.title}</span><i class="keys">${keys(it.keys)}</i></div>`).join('')}</section>`).join('')}</div>`;

function filterList() {
  const q = norm(input.value.trim());

  $('#cmdCount').textContent = `${hits} ${plural(hits, 'skrót', 'skróty', 'skrótów')}`;
}

/* Przytrzymanie: Ctrl trzymany chwilę bez innego klawisza wyciąga skróty z kontrolek */
let capTimer = 0;
function showCaps() {
  const a = app.getBoundingClientRect(), d = dock.getBoundingClientRect();
  const cx = d.left + d.width / 2, cy = d.top + d.height / 2;
  $('#caps').innerHTML = HOLD.map((h) => {
    const el = $(h.sel), r = el && el.getBoundingClientRect();
    if (!r || !r.width || (h.when && !h.when())) return '';
    if (state.home && state.peek === null && el.closest('#barCtx, .pane')) return '';
    const x = h.side === 'right' ? r.right + 7 : h.end ? r.right : r.left + r.width / 2;
    const y = h.side === 'top' ? r.top - 9 : h.side === 'bottom' ? r.bottom + 6 : r.top + r.height / 2;
    const delay = Math.round(Math.hypot(x - cx, y - cy) * .2);
    const text = h.label ? `<b>${h.keys.join(' ')}</b>${h.label}` : h.keys.join(' ');
    return `<span class="kc ${h.side}${h.end ? ' end' : ''}" style="left:${x - a.left}px;top:${y - a.top}px;--d:${delay}ms"><kbd>${text}</kbd></span>`;
  }).join('');
  $('#caps').getBoundingClientRect();
  $('#caps').classList.add('on');
}
function hideCaps() {
  clearTimeout(capTimer);
  $('#caps').classList.remove('on');
}
