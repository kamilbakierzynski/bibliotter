});

chev.addEventListener('click', () => setNav(!state.nav));

/* Krawędź można chwycić: reaguje na kursor, ciągnie się za ręką i odskakuje */
let drag = null;
grip.addEventListener('pointerdown', (e) => {
  grip.setPointerCapture(e.pointerId);
  drag = { x0: e.clientX, start: rope.target, moved: false };
  rope.setPull(e.clientY - G.top);
  rope.bump.to(0);
});
grip.addEventListener('pointermove', (e) => {
  const y = e.clientY - G.top;
  if (!drag) { rope.bumpY = y; rope.bump.to(6); return; }
  const dx = e.clientX - drag.x0;
  if (!drag.moved && Math.abs(dx) > 3) { drag.moved = true; edgeMotion(); }
  if (!drag.moved) return;
  let x = drag.start + dx;
  if (x > G.open) x = G.open + Math.sqrt(x - G.open) * 3.2;
  if (x < G.closed) x = G.closed - Math.sqrt(G.closed - x) * 2.2;
  rope.setPull(y);
  rope.target = x;
  sL.to(x + G.stageGap);
  dockC.to((sL.t + sR.t) / 2);
  wake();
});
grip.addEventListener('pointerup', (e) => {
  const d = drag;
  drag = null;
  if (!d) return;
  const y = e.clientY - G.top;
  if (!d.moved) { setNav(!state.nav, y); return; }
  const i = Math.round(rope.pull * (rope.n - 1));
  setNav(rope.target + rope.vs[i] * .14 > (G.open + G.closed) / 2, y);
});
grip.addEventListener('pointerleave', () => { if (!drag) rope.bump.to(0); });

$('#camMap').addEventListener('click', (e) => { const b = e.target.closest('[data-cam]'); if (b) { closePeek(); focusPane(Number(b.dataset.cam)); } });
$('#tools').addEventListener('click', (e) => { const b = e.target.closest('[data-tool]'); if (b) setTool(state.tool === b.dataset.tool ? 'move' : b.dataset.tool); });
tray.addEventListener('pointerdown', (e) => { if (e.target.closest('[data-sel]')) e.preventDefault(); });
tray.addEventListener('mousedown', (e) => { if (e.target.closest('[data-sel]')) e.preventDefault(); });
tray.addEventListener('click', (e) => {
  const sel = e.target.closest('[data-sel]');
  if (sel) { selAction(sel.dataset.sel); return; }
  const who = e.target.closest('[data-tray-aud]');
  if (who) {
    state.aud = who.dataset.trayAud;
    $$('[data-tray-aud]').forEach((x) => x.classList.toggle('on', x === who));
    return;
  }
  const b = e.target.closest('[data-color]');
  if (!b) return;
  state.color = b.dataset.color;
  $$('.swatch').forEach((s) => s.classList.toggle('on', s === b));
  ghost.innerHTML = `<div class="gs ${state.color}"></div>`;
});
$('#statusBtn').addEventListener('click', (e) => { e.stopPropagation(); togglePop(); });
pop.addEventListener('click', (e) => { const b = e.target.closest('[data-status]'); if (b) { setStatus(b.dataset.status); popPill.to(rectIn($(`[data-status="${b.dataset.status}"]`, pop), pop), true); setTimeout(() => togglePop(false), 140); } });
pop.addEventListener('pointerover', (e) => { const b = e.target.closest('[data-status]'); if (b) popPill.to(rectIn(b, pop)); });
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-open-cmd]')) { openCmd(); return; }
  if (!e.target.closest('#statusPop') && pop.classList.contains('on')) togglePop(false);
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'close') closeSheet(Number(a.closest('.pane').dataset.pane));
  if (act === 'pin') pinPeek();
  if (act === 'insp-close') setInsp(false);
  if (act === 'resolve') {
    const n = NOTES.find((x) => x.id === a.dataset.id);
    n.status = 'resolved';
    state.selNote = null;
    renderPane(state.focus);
    renderInsp();
    syncDock();
  }
});

dock.addEventListener('pointerover', (e) => {
  const b = e.target.closest('[data-tip]');
  if (!b || state.cmd || pop.classList.contains('on')) return;
  clearTimeout(tipTimer); clearTimeout(tipOff);
  if (tipLive) showTip(b); else tipTimer = setTimeout(() => showTip(b), 380);
});
dock.addEventListener('pointerleave', () => { hideTip(); tipOff = setTimeout(() => { tipLive = false; }, 320); });

home.addEventListener('click', (e) => {
  if (home.dataset.skip) { delete home.dataset.skip; return; }
  if (e.target.closest('#setupAdd')) { runScan(); return; }
  const view = e.target.closest('[data-home-view]');
  if (view) { setHomeView(view.dataset.homeView); return; }
  const doc = e.target.closest('[data-doc]');
  if (!doc) return;
  state.kbd = false;
  if (e.ctrlKey || e.metaKey) peekDoc(doc.dataset.doc); else openDoc(doc.dataset.doc);
});
home.addEventListener('pointerover', (e) => {
  const el = e.target.closest('[data-doc]');
  if (!el || el === glowEl) return;
  glowEl = el;
  const r = el.getBoundingClientRect(), a = app.getBoundingClientRect();
  glowD.to(r.left - a.left + r.width / 2 - (sL.t + sR.t) / 2);
  paintGlow(DOCS[el.dataset.doc].glow);
  if (state.homeView === 'list') homeSelect(homeItems().indexOf(el), true);
  else if (homeIdx >= 0) homeDeselect();
});
home.addEventListener('pointerleave', () => {
  glowEl = null;
  glowD.to(0);
  applyGlow();
});
home.addEventListener('dragover', (e) => {
  if (!state.setup) return;
  e.preventDefault();
  home.classList.add('drop');
});
home.addEventListener('dragleave', () => home.classList.remove('drop'));
home.addEventListener('drop', (e) => {
  e.preventDefault();
  home.classList.remove('drop');
  if (state.setup) runScan();
});
$('#homeBtn').addEventListener('click', () => toggleHome());

stage.addEventListener('pointerdown', (e) => {
  const pane = e.target.closest('.pane');
  if (!pane && state.home && state.peek !== null) { home.dataset.skip = '1'; closePeek(); return; }
  if (pane && state.peek !== null && Number(pane.dataset.pane) !== state.peek) { closePeek(); return; }
  if (pane) focusPane(Number(pane.dataset.pane));
  if (state.tool === 'move') return;
  const docEl = e.target.closest('.doc');
  if (!docEl) return;
  e.preventDefault();
  const r = docEl.getBoundingClientRect();
  placeDraft(docEl.parentElement, e.clientX - r.left, e.clientY - r.top);
});
document.addEventListener('selectionchange', () => {
  const sel = getSelection(), node = sel && sel.anchorNode;
  const el = node && (node.nodeType === 1 ? node : node.parentElement);
  const on = !!(el && !sel.isCollapsed && el.closest('.doc'));
  if (on === state.sel) return;
  state.sel = on;
  syncTray();
});
stage.addEventListener('click', (e) => {
  const moved = e.target.closest('[data-moved]');
  if (moved) {
    e.stopPropagation();
    const kind = moved.dataset.moved;
    if (kind === 'split') splitKey();
    if (kind === 'insp') setInsp(!state.insp);
    return;
  }
  const aud = e.target.closest('[data-draft-aud]');
  if (aud && draft) {
    draft.aud = aud.dataset.draftAud;
    $$('[data-draft-aud]', draft.el).forEach((b) => b.classList.toggle('on', b === aud));
    $('textarea', draft.el).focus();
    return;
  }
  const n = e.target.closest('[data-note]');
  if (n && !n.classList.contains('anchor')) { selectNote(n.dataset.note); return; }
  if (state.selNote && !e.target.closest('.th-pop')) setSelNote(null);
});
stage.addEventListener('scroll', (e) => {
  if (e.target.classList && e.target.classList.contains('sheet')) hang();
}, true);
stage.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && e.target.closest('.th-pop')) { e.stopPropagation(); setSelNote(null); return; }
  if (e.target.tagName !== 'TEXTAREA') return;
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commitDraft(); }
  if (e.key === 'Escape') { e.stopPropagation(); removeDraft(); }
});
stage.addEventListener('pointermove', (e) => {
  if (state.tool === 'move') return;
  const on = !!e.target.closest('.doc');
  if (on && !ghost.classList.contains('on')) { gx.set(e.clientX); gy.set(e.clientY); }
  ghost.classList.toggle('on', on);
  gx.to(e.clientX); gy.to(e.clientY);
});
stage.addEventListener('pointerleave', () => ghost.classList.remove('on'));

$('#viewSeg').addEventListener('click', (e) => { const b = e.target.closest('[data-view-mode]'); if (b) setNotesView(b.dataset.viewMode); });
$('#threads').addEventListener('click', (e) => {
  if (e.target.closest('.reply')) return;
  const t = e.target.closest('[data-thread]');
  if (t) selectNote(t.dataset.thread);
});

handle.addEventListener('pointerdown', (e) => { handle.setPointerCapture(e.pointerId); handle._drag = true; });
handle.addEventListener('pointermove', (e) => {
  if (!handle._drag) return;
  const r = stage.getBoundingClientRect();
  ratio.to(clamp((e.clientX - r.left) / r.width, .28, .72));
});
handle.addEventListener('pointerup', () => { handle._drag = false; });

input.addEventListener('input', () => {
  if (state.map) { filterList(); return; }
  if (input.value === '?') { setMap(true); return; }
  cmdQuery = input.value;
  const m = cmdQuery.match(/^([^\s:]+):(.*)$/), key = m && filterKey(m[1]);
  cmdPick = key ? { key, q: m[2] } : null;
  renderCmd();
});
input.addEventListener('keydown', (e) => {
  if (state.map) {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeCmd(); }
    return;
  }
  if (runChord(e)) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); cmdSelect(cmdIdx + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cmdSelect(cmdIdx - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); runCmd(e.ctrlKey || e.metaKey); }
  else if (e.key === 'Escape') {
    e.preventDefault();
    e.stopPropagation();
    if (cmdPick) { cmdPick = null; cmdQuery = ''; input.value = ''; renderCmd(); } else closeCmd();
  } else if (e.key === 'Backspace' && !input.value && cmdOrder.length) {
    dropFilter(...cmdOrder[cmdOrder.length - 1]);
  } else if (e.key === 'Tab') {
    e.preventDefault();
    if (cmdPick) { runCmd(false); return; }
    const key = filterKey(input.value.trim());
    if (key) { input.value = `${FILTERS[key].op}:`; input.dispatchEvent(new Event('input')); }
  }
});
$('#cmd').addEventListener('pointerdown', (e) => { if (e.target !== input && e.target !== $('#actInput')) e.preventDefault(); });
$('#cmdChips').addEventListener('click', (e) => { const b = e.target.closest('[data-drop]'); if (b) dropFilter(b.dataset.drop, b.dataset.v); });
$('#cmdFilters').addEventListener('click', (e) => {
  const add = e.target.closest('[data-add]');
  if (add) { input.value = `${FILTERS[add.dataset.add].op}:`; input.dispatchEvent(new Event('input')); input.focus(); }
});
$('#actInput').addEventListener('input', renderActs);
$('#actInput').addEventListener('keydown', (e) => {
  if (runChord(e)) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); actSelect(actIdx + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); actSelect(actIdx - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); if (actItems[actIdx]) actItems[actIdx].run(); }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeActs(); }
});
$('#actRows').addEventListener('pointermove', (e) => { const r = e.target.closest('.ar'); if (r && Number(r.dataset.a) !== actIdx) actSelect(Number(r.dataset.a)); });
$('#actRows').addEventListener('click', (e) => { const r = e.target.closest('.ar'); if (r) actItems[Number(r.dataset.a)].run(); });
scrim.addEventListener('click', closeCmd);

addEventListener('keydown', (e) => {
  if (e.repeat) return;
  hideCaps();
  const alone = e.key === 'Control' || e.key === 'Meta';
  if (alone && !state.cmd && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) capTimer = setTimeout(showCaps, 380);
}, true);
addEventListener('keyup', (e) => { if (e.key === 'Control' || e.key === 'Meta') hideCaps(); }, true);
addEventListener('pointerdown', () => hideCaps(), true);
addEventListener('blur', () => hideCaps());

addEventListener('keydown', (e) => {
  const tag = document.activeElement?.tagName || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA';
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'k') { e.preventDefault(); if (!state.cmd) openCmd(); else if (state.map) setMap(false); else if (state.acts) closeActs(); else openActs(); return; }
  if (mod && k === 'b') { e.preventDefault(); setNav(!state.nav); return; }
  if (mod && (k === '\\' || e.code === 'Backslash')) { e.preventDefault(); splitKey(); return; }
  if (mod && pinned() > 1 && state.peek === null && !typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    focusPane(state.order[clamp(state.order.indexOf(state.focus) + (e.key === 'ArrowRight' ? 1 : -1), 0, pinned() - 1)]);
    return;
  }
  if (state.cmd) { if (e.key === 'Escape') closeCmd(); return; }
  if (!typing && !state.cmd && state.home && state.peek === null && !state.setup && homeKey(e)) return;
  if (typing || mod || e.altKey) return;
  if (state.home && state.peek === null && 'vcnsix'.includes(k)) return;
  if (e.key === 'Escape') {
    setTool('move');
    togglePop(false);
    if (state.selNote) setSelNote(null);
    else closePeek();
    return;
  }
  if (k === 'v') setTool('move');
  else if (k === 'c') setTool(state.tool === 'comment' ? 'move' : 'comment');
  else if (k === 'n') setTool(state.tool === 'sticky' ? 'move' : 'sticky');
  else if (k === 'i') { if (e.shiftKey) toggleNotesView(); else setInsp(!state.insp); }
  else if (k === 's') togglePop();
  else if (k === 'x') closeSheet(state.focus);
  else if (k === 'h') { if (e.shiftKey) toggleHomeView(); else toggleHome(); }
  else if (k === 't') toggleMode();
  else if (e.key === '?') openMap();
  else if ('1234'.includes(k) && LAB.options[Number(k) - 1]) setLab(LAB.options[Number(k) - 1][0]);
});

addEventListener('resize', () => { applyLayout(); syncRail(true); syncSel(true); syncTools(true); });

const pinWatch = new ResizeObserver((list) => list.forEach((x) => placePins(x.target)));
paneEls.forEach((el) => pinWatch.observe($('.sheet', el)));

/* ---------- Start ---------- */
function start() {
  if (matchMedia('(prefers-color-scheme: dark)').matches && root.dataset.theme !== 'light' || root.dataset.theme === 'dark') state.mode = 'dark';
  root.dataset.mode = state.mode;
  renderIcons();
  renderMoved();
  renderLab();
  $('#labHint').textContent = `? skróty · przytrzymaj ${MOD}`;
  $('#cmdKeys').innerHTML = keys([MOD, 'K']);
  renderRail();
  renderPanel();
  renderPane(0);
  renderInsp();
  renderPop();
  syncDock();
  applyGlow();
  app.dataset.tool = 'move';
  insp.classList.toggle('open', state.insp);

  measure();
  navL.set(G.shapeLeft); navT.set(G.navTop); navB.set(G.H - G.navBot); navR.set(G.r);
  const base = G.W - G.stageRight, right = base - (state.insp && !G.overlay ? G.insW + G.stageGap : 0);
  rope.place(G.closed);
  insB.set(base); insT.set(G.insTop); insE.set(G.H - G.insBot);
  insRope.place(base);
  sL.set(G.closed + G.stageGap); sR.set(right);
  dockC.set((G.open + G.stageGap + right) / 2);
  rope.T = navT.x; rope.B = navB.x;
  syncRail(true);
  syncTools(true);
  syncLab(true);
  syncViewSeg(true);
  syncHomeSeg(true);
  render();
  requestAnimationFrame(() => {
    setNav(true, navT.x + 30);
    dockIn.to(1);
    if (state.insp) setTimeout(() => setInsp(true), 180);
    setLab(state.lab);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resync);
}
start();
})();
</script>
</body>
